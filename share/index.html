<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하늘일기</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #87CEEB 0%, #1e3a5f 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p  { font-size: 16px; opacity: 0.85; margin: 0 0 32px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
  <script>
    (function () {
      // ───────────────────────────────────────────
      // TODO: 앱 출시 후 아래 두 URL을 실제 값으로 교체 (loadmap_daily.md 참고)
      var APP_STORE_URL  = 'https://apps.apple.com/app/id000000000';   // ← App Store ID 교체 필요
      var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.cultsoda.memoApp';
      // ───────────────────────────────────────────

      var ua = navigator.userAgent || '';
      var isIOS     = /iPhone|iPad|iPod/.test(ua);
      var isAndroid = /Android/.test(ua);

      if (isIOS) {
        window.location.replace(APP_STORE_URL);
      } else if (isAndroid) {
        window.location.replace(PLAY_STORE_URL);
      }
      // PC는 아래 페이지 그대로 표시
    })();
  </script>
</head>
<body>
  <div class="emoji">🌤️</div>
  <h1>하늘일기</h1>
  <p>하늘을 보며 떠오른 추억을 기록하는 곳<br>모바일 앱에서 확인해보세요.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.cultsoda.memoApp">
    앱 다운로드
  </a>
</body>
</html>
